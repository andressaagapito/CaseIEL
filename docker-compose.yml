version: '3.8'

services:
  backend:
    build:
      context: ./docker/php
    container_name: caseiel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/backend
    working_dir: /var/www/backend
    command: php -S 0.0.0.0:8000 -t public
    depends_on:
      - sqlserver

  frontend:
    image: node:20-alpine
    container_name: caseiel_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: "http://localhost:8000"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: caseiel_sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
